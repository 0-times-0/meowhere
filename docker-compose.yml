services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: meowhere_postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meow_password}
      POSTGRES_DB: ${POSTGRES_DB:-meowhere_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meow_user} -d ${POSTGRES_DB:-meowhere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meowhere_api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-meow_user}:${POSTGRES_PASSWORD:-meow_password}@db:5432/${POSTGRES_DB:-meowhere_db}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: